# Production auth settings for project kmplus-people (ADR-0011). Apply: supabase config push --project-ref <ref>
# Only declared properties are pushed. The recovery template needs custom SMTP first (free tier).

project_id = "dprkreyvdefbaqlwnzsj"

[auth]
site_url = "https://internal.kmplus.co.id"
additional_redirect_urls = ["https://internal.kmplus.co.id/login/password", "http://localhost:3000/login/password"]
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.recovery]
subject = "Set your KMPlus People password"
content_path = "./supabase/templates/recovery.html"
