# Production deployment for kmplus-people (internal.kmplus.co.id)
#
# Runs on the same server as injourney-rinjani2.0 (which uses host port 86).
# This stack publishes the app on host port 88 to avoid a clash.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kmplus-people:latest
    container_name: kmplus-people-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talks to the db service on the compose network
      DATABASE_URL: "postgresql://kmplus:${POSTGRES_PASSWORD:-kmplus}@db:5432/kmplus_people?schema=public"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env.production}"
      APP_ORIGIN: "${APP_ORIGIN:-https://internal.kmplus.co.id}"
      NEXT_PUBLIC_FIREBASE_API_KEY: "${NEXT_PUBLIC_FIREBASE_API_KEY:?set NEXT_PUBLIC_FIREBASE_API_KEY in .env.production}"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?set NEXT_PUBLIC_FIREBASE_PROJECT_ID in .env.production}"
      FIREBASE_SERVICE_ACCOUNT_JSON: "${FIREBASE_SERVICE_ACCOUNT_JSON:?set FIREBASE_SERVICE_ACCOUNT_JSON in .env.production}"
      NODE_ENV: "production"
      # First boot pushes schema + seeds. Set to false after initial launch.
      RUN_DB_PUSH: "${RUN_DB_PUSH:-true}"
      RUN_DB_SEED: "${RUN_DB_SEED:-true}"
    ports:
      # host:container -> reachable as http://<server-ip>:88
      - "88:3000"
    networks:
      - kmplus

  db:
    image: postgres:16-alpine
    container_name: kmplus-people-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: kmplus
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kmplus}"
      POSTGRES_DB: kmplus_people
    volumes:
      - kmplus_people_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmplus -d kmplus_people"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - kmplus
    # DB is only used internally by the app; no host port published.

volumes:
  kmplus_people_pg_prod:

networks:
  kmplus:
    driver: bridge
