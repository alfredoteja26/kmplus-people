# Production deployment for kmplus-people (internal.kmplus.co.id)
#
# The app runs here; Supabase is the backend (Postgres, Auth, Storage). No database container.
# Runs on the same server as injourney-rinjani2.0 (host port 86); this stack publishes host port 88.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kmplus-people:latest
    container_name: kmplus-people-app
    restart: unless-stopped
    environment:
      # Supabase transaction pooler (app) and session pooler (prisma db push). See README-DEPLOY.md.
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.production}"
      DIRECT_URL: "${DIRECT_URL:?set DIRECT_URL in .env.production}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env.production}"
      APP_ORIGIN: "${APP_ORIGIN:-https://internal.kmplus.co.id}"
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL in .env.production}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in .env.production}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY in .env.production}"
      SMTP_HOST: "${SMTP_HOST:?set SMTP_HOST in .env.production}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:?set SMTP_USER in .env.production}"
      SMTP_PASS: "${SMTP_PASS:?set SMTP_PASS in .env.production}"
      SMTP_FROM: "${SMTP_FROM:?set SMTP_FROM in .env.production}"
      NODE_ENV: "production"
      # Schema changes only: one boot with RUN_DB_PUSH=true, then back to false. Never seed production.
      RUN_DB_PUSH: "${RUN_DB_PUSH:-false}"
    ports:
      # host:container -> reachable as http://<server-ip>:88
      - "88:3000"
